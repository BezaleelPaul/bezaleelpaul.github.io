name: Regenerate résumé PDF and project QR
on:
  push:
    branches:
      - feature/studio-guitar-photo
    paths:
      - "src/data/resume.json"
      - "scripts/build_resume_pdf.py"
      - ".github/workflows/regenerate-resume.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and QR dependencies
        run: python -m pip install reportlab qrcode
      - name: Generate résumé PDF and archive QR
        run: python scripts/build_resume_pdf.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf public/project-archive-qr.svg src/data/resumePdf.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate current resume PDF and project archive QR [skip ci]"
            git push
          fi
